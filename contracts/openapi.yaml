            "type": "string",
            "minLength": 20,
            "maxLength": 20000
          },
          "imageUrl": {
            "type": "string"
          },
          "ticketSalesMode": {
            "type": "string",
            "enum": [
              "PARALLEL",
              "SEQUENTIAL_POOLS"
            ]
          },
          "maxTicketsPerOrder": {
            "description": "Accepted as a JSON integer or a decimal form string.",
            "oneOf": [
              {
                "type": "integer",
                "minimum": 1,
                "maximum": 10
              },
              {
                "type": "string",
                "pattern": "^(?:[1-9]|10)$"
              }
            ]
          }
        }
