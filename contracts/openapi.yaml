          },
          "title": {
            "type": "string",
            "minLength": 3,
            "maxLength": 160
          },
          "description": {
            "type": "string",
            "minLength": 10,
            "maxLength": 5000
          },
          "date": {
            "type": "string",
            "format": "date"
          },
