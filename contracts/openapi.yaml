        "additionalProperties": false,
        "required": [
          "mutationId",
          "title",
          "description",
          "date",
          "time",
          "venueName",
          "address",
          "city",
          "category",
          "complaintsEmail",
          "termsText",
          "ticketSalesMode",
          "maxTicketsPerOrder"
        ],
