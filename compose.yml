services:
  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${BILO_HTTP_BIND:-0.0.0.0}:${BILO_HTTP_PORT:-80}:80"
      - "${BILO_HTTPS_BIND:-0.0.0.0}:${BILO_HTTPS_PORT:-443}:443"
    environment:
      BILO_DOMAIN: ${BILO_DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
      - app
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: ${BILO_FRONTEND_IMAGE:-biloapp-frontend}:${BILO_FRONTEND_REVISION:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      APP_URL: ${APP_URL:-http://localhost}
      INTERNAL_API_URL: http://backend:3001
      NEXT_PUBLIC_API_URL: /api/v1
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${BILO_BACKEND_IMAGE:-biloapp-backend}:${BILO_BACKEND_REVISION:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BILO_SOURCE_REVISION: ${BILO_BACKEND_REVISION:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      APP_ENV: ${APP_ENV:-local}
      APP_URL: ${APP_URL:-http://localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bilo}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-biloapp_local}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-random-32-byte-secret}
      AUDIT_HASHING_SECRET: ${AUDIT_HASHING_SECRET:-replace-with-a-distinct-random-secret}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-BILO Bilety <bilety@biloapp.pl>}
      BILO_RELEASE_ID: ${BILO_RELEASE_ID:-local}
    volumes:
      - backend_storage:/app/storage
    networks:
      - app
      - database
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-biloapp_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  public:
  app:
  database:
    internal: true

volumes:
  postgres_data:
  backend_storage:
  caddy_data:
  caddy_config:
