services:
  proxy:
    restart: always
    environment:
      BILO_DOMAIN: ${BILO_DOMAIN:?Set BILO_DOMAIN to the production host}
    ports:
      - "80:80"
      - "443:443"

  frontend:
    restart: always
    build:
      args:
        APP_URL: ${APP_URL:?Set APP_URL}
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?Set APP_URL}
      INTERNAL_API_URL: http://backend:3001
      NEXT_PUBLIC_API_URL: /api/v1

  backend:
    restart: always
    environment:
      NODE_ENV: production
      APP_ENV: production
      APP_URL: ${APP_URL:?Set APP_URL}
      NEXTAUTH_URL: ${APP_URL:?Set APP_URL}
      BILO_DEPLOYMENT_TARGET: production
      BILO_EXPECTED_PUBLIC_HOST: ${BILO_DOMAIN:?Set BILO_DOMAIN}
      BILO_DATABASE_INSTANCE_ID: ${BILO_DATABASE_INSTANCE_ID:?Set BILO_DATABASE_INSTANCE_ID}
      BILO_EXPECTED_DATABASE_NAME: ${POSTGRES_DB:?Set POSTGRES_DB}
      BILO_EXPECTED_DATABASE_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      BILO_EXPECTED_SCHEMA_MARKER: ${BILO_EXPECTED_SCHEMA_MARKER:?Set BILO_EXPECTED_SCHEMA_MARKER}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      AUDIT_HASHING_SECRET: ${AUDIT_HASHING_SECRET:?Set AUDIT_HASHING_SECRET}
      PRIVACY_HMAC_MASTER_SECRET: ${PRIVACY_HMAC_MASTER_SECRET:?Set PRIVACY_HMAC_MASTER_SECRET}
      PRIVACY_SUBJECT_ENCRYPTION_KEY: ${PRIVACY_SUBJECT_ENCRYPTION_KEY:?Set PRIVACY_SUBJECT_ENCRYPTION_KEY}
      PRIVACY_OUTBOX_ENCRYPTION_KEY: ${PRIVACY_OUTBOX_ENCRYPTION_KEY:?Set PRIVACY_OUTBOX_ENCRYPTION_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:?Set STRIPE_CONNECT_WEBHOOK_SECRET}
      PAYMENT_ACCEPTANCE_PAUSED: ${PAYMENT_ACCEPTANCE_PAUSED:?Set PAYMENT_ACCEPTANCE_PAUSED}
      ORGANIZER_SETOFF_ENABLED: ${ORGANIZER_SETOFF_ENABLED:-false}
      BILO_BUYER_SERVICE_FEE_FIXED_CENTS: ${BILO_BUYER_SERVICE_FEE_FIXED_CENTS:-299}
      BILO_ORGANIZER_COMMISSION_FIXED_CENTS: ${BILO_ORGANIZER_COMMISSION_FIXED_CENTS:-100}
      BILO_HIGH_PRICE_THRESHOLD_CENTS: ${BILO_HIGH_PRICE_THRESHOLD_CENTS:-15000}
      BILO_HIGH_PRICE_BUYER_FEE_FIXED_CENTS: ${BILO_HIGH_PRICE_BUYER_FEE_FIXED_CENTS:-499}
      MAIL_PROVIDER: ${MAIL_PROVIDER:?Set MAIL_PROVIDER}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      EMAIL_PAYLOAD_ENCRYPTION_KEY: ${EMAIL_PAYLOAD_ENCRYPTION_KEY:?Set EMAIL_PAYLOAD_ENCRYPTION_KEY}
      MAINTENANCE_SECRET: ${MAINTENANCE_SECRET:?Set MAINTENANCE_SECRET}
      BILO_RELEASE_ID: ${BILO_RELEASE_ID:?Set BILO_RELEASE_ID}

  db:
    restart: always
